[package]
name = "gutch"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
description = "Provider-independent snapshot, artifact delivery, reconstruction, and verification engine"
license = "MIT AND Apache-2.0 AND ISC"

[workspace]
members = ["gutch-cli"]
resolver = "3"

[workspace.lints.cargo]
unused_dependencies = "deny"

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
# BLAKE3 hashing (chunk/bundle integrity)
zstd = "0.13.3"
# Zstandard compression (bundle compression)
lz4 = "1.28.1"
# LZ4 compression (optional compression profile)
serde = { version = "1.0.228", features = ["derive", "rc"] }
# Serialization framework
serde_json = "1.0.150"
# JSON parsing (manifests, configs)
clap = { version = "4.6.1", features = ["derive"] }
# CLI argument parsing for generic Gutch commands
walkdir = "2.5.0"
# Recursive directory traversal
chrono = "0.4.45"
# Date/time (timestamps in manifests)
thiserror = "2.0.18"
# Custom error type derivation
rayon = "1.12.0"
# Data parallelism (parallel chunk hashing)
num_cpus = "1.17.0"
# Physical and logical CPU counts for runtime defaults
tempfile = "3.27.0"
# Temporary files/dirs (staging during reconstruct)
reqwest = { version = "0.13.4", features = [
    "blocking",
    "json",
    "multipart",
    "rustls",
] }
# HTTP client (bundle downloads from signed URLs) default-features = false,
indicatif = "0.18.4"
# CLI progress bars (download/install progress)
smol_str = { version = "0.3.2", features = ["serde"] }
# Small owned strings for clone-heavy metadata
urlencoding = "2.1.3"
unicode-normalization = "0.1"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "time", "macros"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
# Independent boundary oracle for the Gutch-owned FastCDC implementation.
fastcdc = "=5.0.0"
bolero = "0.13"

[profile.fuzz]
inherits = "release"
debug = 1
codegen-units = 1
