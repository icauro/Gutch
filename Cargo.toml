[package]
name = "gutch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider-independent snapshot, artifact delivery, reconstruction, and verification engine"
license = "MIT AND Apache-2.0 AND ISC"
repository.workspace = true
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]

[workspace]
members = ["gutch-cli"]
resolver = "3"

# A release changes the version here, in both places, and nowhere else.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/icauro/Gutch"

[workspace.dependencies]
gutch = { version = "0.2.0", path = "." }

[workspace.lints.cargo]
unused_dependencies = "deny"

[lints]
workspace = true

[features]
default = ["cli"]
# The `gutch` command line: `run_command_line` and its argument parser and
# progress bars. Embedding hosts that bring their own interface can turn it off.
cli = ["dep:clap", "dep:indicatif"]

[dependencies]
# BLAKE3 hashing (chunk/bundle integrity)
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
# Zstandard compression (bundle compression); `experimental` exposes the
# working-memory estimates used for the memory budget.
zstd = { version = "0.13.4", features = ["experimental"] }
# LZ4 compression (optional compression profile)
lz4 = "1.28.1"
# Serialization framework; `rc` serializes the shared index records.
serde = { version = "1.0.229", features = ["derive", "rc"] }
# JSON parsing (manifests, configs)
serde_json = "1.0.154"
# Recursive directory traversal
walkdir = "2.5.0"
# Date/time (timestamps in manifests)
chrono = "0.4.45"
# Custom error type derivation
thiserror = "2.0.21"
# Data parallelism (parallel chunk hashing)
rayon = "1.12.0"
# Temporary files/dirs (staging during reconstruct)
tempfile = "3.27.0"
# HTTP client (bundle downloads from signed URLs)
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "http2",
    "rustls",
    "system-proxy",
] }
# Unicode path normalization for cross-platform path constraints
unicode-normalization = "0.1"
# Async runtime for parallel, cancellable downloads
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }
# CPU core counts and memory size for runtime defaults
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# CLI argument parsing (`cli` feature)
clap = { version = "4.6.7", features = ["derive"], optional = true }
# CLI progress bars (`cli` feature)
indicatif = { version = "0.18.6", optional = true }
# AES-256-GCM and random numbers for encrypted repositories (already used by
# reqwest's TLS)
aws-lc-rs = "1.19.0"
# Password-based keys for encrypted repositories
argon2 = "0.6.0"
# Clears repository keys from memory when dropped
zeroize = "1.9.1"

[dev-dependencies]
# Independent boundary oracle for the Gutch-owned FastCDC implementation.
fastcdc = "=5.0.0"
bolero = "0.13"
schemars = "1"

[profile.fuzz]
inherits = "release"
debug = 1
codegen-units = 1

# Unlocking a password-protected repository in a debug build would otherwise
# take over a second.
[profile.dev.package.argon2]
opt-level = 3
