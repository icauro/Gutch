[package]
name = "gutch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gutch"
path = "src/main.rs"

[dependencies]
fastcdc = "4.0.1"
blake3 = "1.8.5"
zstd = "0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
chrono = "0.4"
thiserror = "2"
rayon = "1.10"
