[package]
name = "gutch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gutch"
path = "src/main.rs"

[dependencies]
fastcdc = "4.0.1"
blake3 = "1.8.5"
zstd = "0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
chrono = "0.4"
thiserror = "2"
rayon = "1.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
keyring = "3.6"
webbrowser = "1"
dialoguer = "0.11"
indicatif = "0.18"
dirs = "5"

[build-dependencies]
winresource = "0.1"
