name: Gutch tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    name: correctness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Frozen corpus paths exceed Windows' 260-character limit; actions/checkout
      # clones before repository configuration applies, so enable it globally.
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - run: uv sync --locked
      - run: uv run python gutch.py test --suite fast
      - run: uv run python gutch.py test --suite local
      - run: uv run python gutch.py test --seed 456 --steps 8 --storage loose_chunks --compression lz4 --mutations 12
      - if: runner.os == 'Linux'
        run: uv run python gutch.py test --suite s3
      # Test reports are only worth keeping when something failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gutch-test-reports-${{ runner.os }}
          path: .artifacts/tests/runs/
          retention-days: 14
