name: Gutch tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - run: uv sync --locked
      - run: uv run python gutch.py test --suite fast
      - run: uv run python gutch.py test --suite local
      - run: uv run python gutch.py test --seed 456 --steps 8 --storage loose_chunks --compression lz4 --mutations 12
      - if: runner.os == 'Linux'
        run: uv run python gutch.py test --suite s3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gutch-${{ runner.os }}
          path: .artifacts/tests/runs/
