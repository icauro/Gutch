name: Build Gutch CLI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'gutch-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/build-cli.yml'
      - '_tools/package_cli.py'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
permissions:
  contents: read
concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release builds do not need the deep-path correctness corpus.
          sparse-checkout: |
            .cargo
            gutch-cli
            src
            _tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .builds/compiler-cache/cargo
          key: cli-${{ matrix.target }}-rust1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: cli-${{ matrix.target }}-rust1.97.1-${{ hashFiles('Cargo.lock') }}-
      - name: Build release executable
        run: cargo +1.97.1 build --locked --release --package gutch-cli --target ${{ matrix.target }}
      - name: Smoke test native executable
        shell: python
        run: |
          import os, pathlib, subprocess
          target = os.environ['TARGET']
          name = 'gutch-cli.exe' if 'windows' in target else 'gutch-cli'
          binary = pathlib.Path('.builds/compiler-cache/cargo') / target / 'release' / name
          subprocess.run([str(binary.resolve()), '--help'], check=True)
      - name: Package executable, provenance and notices
        run: python _tools/package_cli.py --target ${{ matrix.target }} --toolchain 1.97.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gutch-cli-${{ matrix.platform }}
          path: .builds/releases/${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
