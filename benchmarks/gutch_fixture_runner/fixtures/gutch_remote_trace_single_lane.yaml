name: gutch_remote_trace_single_lane
runner: gutch-fixture
description: Single-lane remote Gutch trace benchmark with corruption and repair enabled.
delete_artifacts: true
open_perfetto: true
corrupt_repair: true
execution:
  default_host: remote
lanes:
  - label: remote-default-gutch
    kind: gutch-individual
    profile:
      chunk: chunk_128KiB
      bundle: bundle_8MiB
      compression:
        algorithm: zstd
        level: 3
      storage: bundled
