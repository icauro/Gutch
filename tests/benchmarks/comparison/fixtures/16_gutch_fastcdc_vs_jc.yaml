name: 16_gutch_fastcdc_vs_jc
runner: gutch-fixture
description: >-
  FastCDC versus Plakar-compatible JC (go-cdc-chunkers v1.1.0), with FastCDC at
  128 KiB target (32-512 KiB bounds) and JC at 256 KiB (64-1024 KiB bounds).
  Both use zstd level 3 and 8 MiB bundles.
  JC uses fixed masks, so these targets do not guarantee matching chunk counts.
  Each lane captures, reconstructs and repairs the same builds in its own repository.
delete_artifacts: true
open_perfetto: false
profile_mode: "off"
repetitions: 3
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
lanes:
  - label: fastcdc
    tool: gutch
    workload: individual
    profile:
      chunker: fastcdc
      chunk: chunk_128KiB
  - label: jc
    tool: gutch
    workload: individual
    profile:
      chunker: jc
      chunk: chunk_256KiB
