profile_mode: detailed
name: 12_gutch_container_trace_single_lane
runner: gutch-fixture
description: Single-lane container Gutch trace benchmark with corruption and repair enabled.
delete_artifacts: true
open_perfetto: true
corrupt_repair: true
execution:
  default_host: container
lanes:
  - label: container-default-gutch
    tool: gutch
    workload: individual
    profile:
      chunk: chunk_128KiB
      bundle: bundle_8MiB
      compression:
        algorithm: zstd
        level: 3
      storage: bundled
