name: gutch_vs_external_tools_individual
runner: gutch-fixture
profile_mode: detailed
description: Compare per-snapshot backups using tool-specific fast compression presets; compression work is not identical.
delete_artifacts: true
open_perfetto: true
corrupt_repair: false
lanes:
  - label: restic
    tool: restic
    workload: individual
    arguments: [--compression, fastest]
  - label: kopia
    tool: kopia
    workload: individual
    arguments: [--compression=zstd-fastest]
  - label: borg
    tool: borg
    workload: individual
    arguments: [--compression, "zstd,1"]
  - label: plakar
    tool: plakar
    workload: individual
  - label: gutch
    tool: gutch
    workload: individual
    profile:
      chunk: chunk_128KiB
      bundle: bundle_8MiB
      compression:
        algorithm: zstd
        level: 1
      storage: bundled
