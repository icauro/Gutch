profile_mode: detailed
name: gutch_reconstruction_storage_paths
runner: gutch-reconstruction-storage
description: Compare local, fetched, and fetch-reconstruct Gutch paths.
delete_artifacts: true
open_perfetto: true
corrupt_repair: false
source:
  container_mock:
    versions: 4
    size_mib: 512
    seed: 0
storage:
  backend: s3
  env_prefix: GUTCH_S3
  upload_concurrency: 8
transfer:
  policy: fixed
  concurrency: 4
execution:
  default_host: local
profile:
  chunk: chunk_128KiB
  bundle: bundle_8MiB
  compression:
    algorithm: zstd
    level: 3
  storage: bundled
