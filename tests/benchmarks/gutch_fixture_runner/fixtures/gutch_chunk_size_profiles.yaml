name: gutch_chunk_size_profiles
runner: gutch-fixture
description: Compare Gutch chunk sizing profiles.
delete_artifacts: true
open_perfetto: false
lanes:
  - label: chunk-256KiB
    kind: gutch-individual
    profile:
      chunk: chunk_256KiB
      bundle: bundle_32MiB
      compression:
        algorithm: zstd
        level: 3
      storage: bundled
  - label: chunk-128KiB
    kind: gutch-individual
    profile:
      chunk: chunk_128KiB
      bundle: bundle_32MiB
      compression:
        algorithm: zstd
        level: 3
      storage: bundled
