name: gutch_reconstruction_storage_paths
runner: gutch-reconstruction-storage
description: Compare local, fetched, and fetch-reconstruct Gutch paths.
delete_artifacts: true
open_perfetto: false
corrupt_repair: false
source:
  remote_mock:
    versions: 4
    size_mib: 512
    seed: 0
storage:
  backend: s3
  endpoint: http://127.0.0.1:9744
  bucket: hostapp-main
  region: auto
  access_key_env: HOSTAPP_SEAWEED_ACCESS_KEY
  secret_key_env: HOSTAPP_SEAWEED_SECRET_KEY
  access_key_default: hostapp-local
  secret_key_default: hostapp-local-secret-key
  upload_concurrency: 8
transfer:
  policy: fixed
  concurrency: 4
execution:
  default_host: local
profile:
  chunk_profile: chunk_128KiB
  bundle_profile: bundle_8MiB
  compression:
    algorithm: zstd
    level: 3
  storage_mode: bundled
