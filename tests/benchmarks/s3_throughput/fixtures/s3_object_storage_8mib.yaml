name: s3_object_storage_8mib
runner: storage-s3
description: Upload and download a shared 8 MiB object set against S3 targets.
targets:
  - name: testing
    enabled: true
    env_prefix: GUTCH_S3
prepare:
  prefix: benchmarks/8mib-set
  size: 8MiB
  upload_concurrency: 4
  object_count: 16
  download_runs: 1
download:
  default_args:
    concurrency: 16
    runs: 1
