name: gutch_vs_external_tools_bulk
runner: gutch-fixture
profile_mode: "off"
description: Compare whole-product snapshots using tool-specific fast compression presets; compression work is not identical.
delete_artifacts: true
open_perfetto: false
lanes:
  - label: gutch-product-default
    tool: gutch
    workload: product-bulk
    profile:
      compression:
        algorithm: zstd
        level: 1
  - label: restic-bulk
    tool: restic
    workload: exact-bulk
    arguments: [--compression, fastest]
  - label: kopia-bulk
    tool: kopia
    workload: exact-bulk
    arguments: [--compression=zstd-fastest]
  - label: borg-bulk
    tool: borg
    workload: exact-bulk
    arguments: [--compression, "zstd,1"]
  - label: plakar-bulk
    tool: plakar
    workload: exact-bulk
