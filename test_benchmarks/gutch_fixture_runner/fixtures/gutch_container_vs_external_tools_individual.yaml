name: gutch_container_vs_external_tools_individual
runner: gutch-fixture
description: Container Linux comparison of per-snapshot Gutch, Restic, Kopia, Borg, and Plakar lanes.
delete_artifacts: true
open_perfetto: true
corrupt_repair: false
snapshot_limit: 1
execution:
  default_host: container
lanes:
  - label: restic-linux
    tool: restic
    workload: individual
    arguments: [--compression, fastest]
  - label: kopia-linux
    tool: kopia
    workload: individual
    arguments: [--compression=zstd-fastest]
  - label: borg-linux
    tool: borg
    workload: individual
    arguments: [--compression, "zstd,1"]
  - label: plakar-linux
    tool: plakar
    workload: individual
  - label: gutch-linux
    tool: gutch
    workload: individual
    profile:
      chunk: chunk_128KiB
      bundle: bundle_8MiB
      compression:
        algorithm: zstd
        level: 1
      storage: bundled
