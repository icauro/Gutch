name: gutch_remote_vs_external_tools_individual
runner: gutch-fixture
description: Remote Linux comparison of per-snapshot Gutch, Restic, Kopia, Borg, and Plakar lanes.
delete_artifacts: true
open_perfetto: true
corrupt_repair: false
snapshot_limit: 1
execution:
  default_host: remote
lanes:
  - label: restic-linux
    kind: restic-individual
    arguments: [--compression, fastest]
  - label: kopia-linux
    kind: kopia-individual
    arguments: [--compression=zstd-fastest]
  - label: borg-linux
    kind: borg-individual
    arguments: [--compression, "zstd,1"]
  - label: plakar-linux
    kind: plakar-individual
  - label: gutch-linux
    kind: gutch-individual
    profile:
      chunk: chunk_128KiB
      bundle: bundle_8MiB
      compression:
        algorithm: zstd
        level: 1
      storage: bundled
