[package]
name = "launcher-publisher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gutch = { path = "../../..", default-features = false }
gutch-s3-store = { path = "../../s3_store" }
launcher-catalog = { path = "../catalog" }
liblzma = "0.4.9"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
