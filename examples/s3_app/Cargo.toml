[package]
name = "gutch-s3-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# A separate workspace, so the GUI dependencies stay out of Gutch's own builds.
[workspace]

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
gutch = { path = "../..", default-features = false }
gutch-s3-store = { path = "../s3_store" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[lints.cargo]
unused_dependencies = "deny"

[dev-dependencies]
tempfile = "3.27.0"
