[package]
name = "gutch-s3-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# A separate workspace, so the GUI dependencies stay out of Gutch's own builds.
[workspace]

[dependencies]
eframe = "0.37.0"
gutch = { path = "../.." }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rfd = "0.18.0"
rusty-s3 = "0.11.0"

[lints.cargo]
unused_dependencies = "deny"

[dev-dependencies]
tempfile = "3.27.0"
