[project]
name = "gutch-tooling"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "boto3>=1.35",
    "PyYAML>=6",
    "pytest>=8",
    "psutil>=6",
    "blake3>=1.0.9",
    "fonttools>=4.50",
]

[tool.pytest.ini_options]
testpaths = ["tests/harness_tests"]
cache_dir = ".artifacts/tests/cache/pytest"

[tool.uv]
package = false
